name: VisionRemotePlay
options:
  bundleIdPrefix: dev.hunter
  deploymentTarget:
    visionOS: "2.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    DEVELOPMENT_TEAM: 36V7M6X3D6
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: Apple Development
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ENABLE_DEBUG_DYLIB: NO
targets:
  VisionRemotePlay:
    type: application
    platform: visionOS
    sources:
      - Sources
      - path: Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.hunter.visionremoteplay
        PRODUCT_NAME: VisionRemotePlay
        SWIFT_OBJC_BRIDGING_HEADER: Native/BridgingHeader.h
        HEADER_SEARCH_PATHS: "$(SRCROOT)/Native"
        LIBRARY_SEARCH_PATHS: "$(SRCROOT)/build/xros"
        OTHER_LDFLAGS: ["$(inherited)", "-lChiakiVisionCore"]
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Remote Play Prototype
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Connect to your PlayStation 5 to stream games over your local network.
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_PrototypeSourceSHA: "$(PROTOTYPE_SOURCE_SHA)"
        INFOPLIST_KEY_PrototypeSourceDigest: "$(PROTOTYPE_SOURCE_DIGEST)"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "3"
        SUPPORTED_PLATFORMS: xros
        SUPPORTS_MACCATALYST: NO
        TARGETED_DEVICE_FAMILY: "7"
        ENABLE_BITCODE: NO
    dependencies:
      - sdk: AVFoundation.framework
      - sdk: GameController.framework
      - sdk: WebKit.framework
      - sdk: Security.framework
      - sdk: CoreImage.framework
      - sdk: RealityKit.framework
      - sdk: VideoToolbox.framework
schemes:
  VisionRemotePlay:
    build:
      targets:
        VisionRemotePlay: all
